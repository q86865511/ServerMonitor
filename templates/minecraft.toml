# Minecraft: Java Edition 內建範本(R1/R11)。
# 對齊 design.md「遊戲範本 schema」;新增沿用同 adapter 的遊戲=加一份此類檔案,不改核心。
#
# 雙審修正 #4:itzg 映像的 java21 tag 只鎖 JRE,不鎖遊戲版本;未鎖 VERSION 時隱含 LATEST,
# 而 LATEST 現需 Java 25(與 java21 tag 不相容)→ 預設建立即啟動崩潰(T9 實測)。
# 故以下方 [[params]] VERSION 鎖為 Java 21 相容版本。**升 VERSION 前務必同步確認目標版本
# 所需 JRE 與本範本鎖定的映像 tag(java21)相容**,否則需一併調整 docker.image tag。
schema_version = 1
id = "minecraft"
name = "Minecraft: Java Edition"
icon = "icons/minecraft.png"          # R14:範本圖示(範本目錄相對路徑;選配)
runtime = "docker"
data_dirs = ["/data"]                 # R9 備份範圍(頂層)

[docker]
# R11 映像鎖:itzg 官方映像,鎖 java21 tag。
# 若需真正不可變鎖定,於部署時以 `docker buildx imagetools inspect itzg/minecraft-server:java21`
# 取 sha256 digest 填入 image_digest。
image = "itzg/minecraft-server:java21"
image_digest = ""

[[variants]]
id = "paper"
loader = "paper"                      # R11 外掛平台(Bukkit API);不可套用 Forge/Fabric 模組包
[variants.env]
TYPE = "PAPER"

[[variants]]
id = "vanilla"
loader = "vanilla"                    # 可套用模組包(itzg 以 TYPE=MODRINTH/AUTO_CURSEFORGE 自管 loader)
[variants.env]
TYPE = "VANILLA"

[[variants]]
id = "forge"
loader = "forge"                      # 模組 loader,可套用模組包
[variants.env]
TYPE = "FORGE"

[[variants]]
id = "fabric"
loader = "fabric"                     # 模組 loader,可套用模組包
[variants.env]
TYPE = "FABRIC"

[[ports]]                              # R2 衝突鍵 (bind_ip, protocol, host_port)
name = "game"
container = 25565
host_port = 25565                      # 可為 0=動態
bind_ip = "0.0.0.0"                    # wildcard 與具體 IP 視為重疊
protocol = "tcp"
required = true

[[ports]]
name = "rcon"
container = 25575
host_port = 25575
bind_ip = "127.0.0.1"                  # RCON 僅綁 loopback
protocol = "tcp"

[[params]]
key = "VERSION"
label = "遊戲版本(Minecraft 版本號;升版前需確認與 docker.image 的 JRE 相容)"
type = "string"
default = "1.21.1"                    # Java 21 相容;對齊本範本鎖定的 itzg java21 tag

[[params]]
key = "MEMORY"
label = "記憶體上限"
type = "string"
default = "2G"

[[params]]
key = "EULA"
label = "接受 Minecraft EULA"
type = "bool"
required = true                        # R2 未接受不得建立(不暗中預設)

[[secrets]]                            # R12 SecretRef:輸入即入金鑰庫,不進 params_json
key = "RCON_PASSWORD"
label = "RCON 密碼"
required = true                        # stop hook 與健康探針依賴 RCON

[[secrets]]                            # R11 CurseForge 模組包金鑰(使用者自申;非必填,選 CurseForge 來源時才需)
key = "CF_API_KEY"
label = "CurseForge API 金鑰"

[[command_protocols]]                  # R7 tagged union
protocol_id = "mc-rcon"
kind = "rcon"                          # raw console
host_port_ref = "rcon"
password_ref = "RCON_PASSWORD"         # 指向 [[secrets]]

[hooks]                                # R3/R8/R9 生命週期映射
stop = { protocol_id = "mc-rcon", command = "stop" }
announce = { protocol_id = "mc-rcon", command = "say {msg}" }

[health]                               # R8 探針
# 用 rcon(非 tcp):Docker 對已發布埠的 userland proxy 會在容器程序尚未真正綁定前即接受 TCP 連線,
# tcp 探針因而「假陽性」提早判就緒(伺服器仍在下載 Paper/啟動 JVM)。rcon 探針走 auth+空指令,
# 伺服器完全起來才回應→就緒判定更正確(啟動時間略長屬預期)。核心零改動(probeRcon 複用 mc-rcon)。
kind = "rcon"                          # tcp | rcon | rest | docker
port_ref = "rcon"

[players_query]                        # R6
kind = "rcon"
command = "list"

[mods]                                 # R11 itzg 唯一擁有者
owner = "image-native"
plugin_dir = "/data/plugins"
modpack_env = ["MODRINTH", "AUTO_CURSEFORGE"]
manual_formats = ["mrpack", "curseforge-zip"]
manual_mount = "/modpacks"             # 手動檔掛載處,交由 itzg 對應 env 取用
# 允許套用模組包的變體 loader(前置相容檢查);paper=外掛平台故排除,選模組包 + paper → 建立前擋
modpack_loaders = ["vanilla", "forge", "fabric", "quilt", "neoforge"]

# ── 本機行程模式(native-backend R3/R4/R5) ──
# 宣告 [native] 使本範本亦可以 native runtime 建立(免 Docker)。頂層 runtime 仍為 docker
# (預設 runtime);能力由區段存在推導(同時有 [docker]/[native] = 兩者皆可)。
# 供應(依變體 loader 選 vanilla/paper/fabric/forge 安裝器)與 eula.txt 寫入由 T5 NativeBackend 落地。
[native.provision]
kind = "java"                          # 需 JVM;實際 server.jar 依變體 loader 由安裝器供應(T5)
java_major = 21                        # 對齊既有 docker.image 的 java21 tag;升 VERSION 前需確認相容

[native.launch]
# working_dir=data:與 docker(itzg)資料佈局對齊——itzg 把 /data 掛在 <實例根>/data/,備份 tar 以
# 整個實例根為根,故 docker 備份含 data/world、data/server.properties 等 data/ 前綴。native 若把
# 伺服器檔寫在實例根頂層,備份少了 data/ 前綴 → docker↔native 備份互轉時世界路徑對不上(雙審 #7)。
# 宣告 working_dir=data 使 NativeBackend 的 workDir=<實例根>/data,連帶讓安裝器 InstanceDir、
# WriteEula 落點、writeConfigFile 目錄(下方 [native.config] 相對 workDir)、以及伺服器行程 cwd
# (world/、logs/ 落點)全部歸入 data/,與 docker 佈局一致。模組落點見 [native.mods](相對實例根,
# 故另寫 data/mods)。
working_dir = "data"
# argv 模板;token 由 NativeBackend 展開:{java}=供應的 JRE、{memory_mb}=由 MEMORY 換算、{server_jar}=安裝器產出。
# 此為 jar 型(vanilla/paper/fabric)的啟動來源。forge/neoforge 變體無單一 server jar(installer
# 產出 run.bat + user_jvm_args.txt),LaunchSpec 為範本級無法逐變體覆寫,故由 NativeBackend 於啟動期
# 偵測「啟動來源為腳本」時就地改寫為等價的 run.bat 啟動(丟棄 -jar {server_jar}、保留 nogui),記憶體
# 上限改注入 user_jvm_args.txt(T13 解法 a;見 internal/agent/native.go rewriteForStartScript)。
command = ["{java}", "-Xmx{memory_mb}M", "-jar", "{server_jar}", "nogui"]

[[native.config]]
# native 無 itzg 代勞,server.properties 由本區段產出。file 相對 working_dir(=data/,見上),故
# 此處只寫 "server.properties" 即落 data/server.properties——**勿再前綴 data/**(writeConfigFile
# 已相對 workDir join,前綴會變成 data/data/server.properties)。分兩來源:
#   [native.config.map] paramKey→configKey:使用者參數落檔(僅 Env 存在者;itzg 亦讀同名 env)。
#   [native.config.set] configKey→字面值/{port:<name>}:native 執行必需但非使用者參數的值。
# T13 E2E 校正:server-port/rcon.port 綁定必須與就緒探針(RCON,綁 rcon 埠)一致,否則就緒永不成立。
file = "server.properties"
format = "properties"
[native.config.map]
# RCON_PASSWORD 為機密(明文注入 Env),供 RCON 認證;MOTD/MAX_PLAYERS 為選填參數(未宣告為 param
# 時不落檔、交伺服器預設,itzg 慣例同名鍵,保留映射以利日後增設 param 即生效)。
RCON_PASSWORD = "rcon.password"
MOTD = "motd"
MAX_PLAYERS = "max-players"
[native.config.set]
# RCON 為就緒探針所需:啟用 + 埠對齊 [[ports]] rcon(25575)、密碼由上方 map 取 RCON_PASSWORD。
# server-port 綁 game 埠(25565);query.port 對齊 game 埠。埠 token 由 NativeBackend 展開為實際主機埠。
"enable-rcon" = "true"
"rcon.port" = "{port:rcon}"
"server-port" = "{port:game}"
"query.port" = "{port:game}"

[native.mods]
# native 模組/模組包落位目錄(相對實例根),對齊 vanilla/forge/fabric 慣例 mods/(R11)。
# docker 路徑由 itzg 依 loader 自管,故 [mods] 另述;此欄僅 native 安裝器(Modrinth/CurseForge)用。
# 注意:modsInstallDir 相對「實例根」而非 working_dir(見 native.go),故此處須顯式含 data/ 前綴,
# 才能與 working_dir=data 下的伺服器檔同落 data/mods(itzg 亦以 /data/mods 為模組目錄,#7 對齊)。
mods_dir = "data/mods"
